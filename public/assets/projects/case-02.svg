<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="bgCase2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414" />
      <stop offset="100%" stop-color="#0a0a0a" />
    </linearGradient>
    <pattern id="gridCase2" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1f1f1f" stroke-width="1" />
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#bgCase2)" />
  <rect width="800" height="500" fill="url(#gridCase2)" />
  
  <!-- Classified Banner -->
  <rect x="40" y="30" width="720" height="36" fill="#181818" stroke="#2d2d2d" stroke-width="1" />
  <rect x="40" y="30" width="6" height="36" fill="#F4C400" />
  <text x="60" y="53" fill="#F4C400" font-family="monospace" font-size="12" letter-spacing="2" font-weight="bold">
    CASE FILE #002 // SECTOR: LIFESTYLE & COMMERCE
  </text>
  <text x="640" y="53" fill="#8A8A8A" font-family="monospace" font-size="11" letter-spacing="2">
    STATUS: ACTIVE
  </text>

  <!-- Left Phone Mockup Graphic -->
  <g transform="translate(140, 110)">
    <rect x="0" y="0" width="180" height="320" rx="24" fill="#101010" stroke="#F4C400" stroke-width="2" />
    <rect x="65" y="10" width="50" height="8" rx="4" fill="#222" />
    
    <!-- Calendar & Coordination Grid -->
    <rect x="15" y="35" width="150" height="60" rx="8" fill="#181818" stroke="#2c2c2c" stroke-width="1" />
    <rect x="25" y="48" width="50" height="8" rx="2" fill="#F4C400" />
    <circle cx="130" cy="52" r="10" fill="#242424" stroke="#F4C400" stroke-width="1" />
    <rect x="25" y="65" width="90" height="6" rx="2" fill="#555" />
    <rect x="25" y="78" width="130" height="4" rx="2" fill="#333" />
    
    <!-- Vendor Booking Card -->
    <rect x="15" y="110" width="150" height="80" rx="8" fill="#161616" stroke="#252525" stroke-width="1" />
    <rect x="25" y="125" width="40" height="40" rx="6" fill="#202020" stroke="#F4C400" stroke-width="1" stroke-dasharray="2 2" />
    <rect x="75" y="130" width="80" height="8" rx="2" fill="#F5F3EE" />
    <rect x="75" y="145" width="60" height="6" rx="2" fill="#F4C400" opacity="0.8" />
    <rect x="75" y="158" width="40" height="6" rx="2" fill="#444" />

    <!-- Payment Gateway Sheet -->
    <rect x="15" y="205" width="150" height="70" rx="8" fill="#191919" stroke="#2c2c2c" stroke-width="1" />
    <rect x="25" y="222" width="70" height="8" rx="2" fill="#F4C400" />
    <rect x="25" y="240" width="130" height="20" rx="4" fill="#F4C400" opacity="0.15" stroke="#F4C400" stroke-width="1" />
    <text x="50" y="254" fill="#F4C400" font-family="monospace" font-size="9" font-weight="bold">SECURE CHECKOUT</text>
  </g>

  <!-- Right Architecture Flow & Telemetry -->
  <g transform="translate(380, 120)">
    <text x="0" y="30" fill="#F5F3EE" font-family="sans-serif" font-size="22" font-weight="bold" letter-spacing="1">
      SHUBH MANGAL PLATFORM
    </text>
    <text x="0" y="60" fill="#8A8A8A" font-family="sans-serif" font-size="13">
      Vendor Marketplace & Synchronized Event Engine
    </text>

    <!-- Architecture Nodes -->
    <g transform="translate(0, 90)">
      <rect x="0" y="0" width="110" height="40" rx="4" fill="#161616" stroke="#F4C400" stroke-width="1" />
      <text x="16" y="25" fill="#F4C400" font-family="monospace" font-size="11">DART / FLUTTER</text>

      <line x1="110" y1="20" x2="160" y2="20" stroke="#F4C400" stroke-width="1.5" stroke-dasharray="3 3" />

      <rect x="160" y="0" width="110" height="40" rx="4" fill="#161616" stroke="#333" stroke-width="1" />
      <text x="180" y="25" fill="#8A8A8A" font-family="monospace" font-size="11">RIVERPOD</text>

      <line x1="270" y1="20" x2="320" y2="20" stroke="#F4C400" stroke-width="1.5" stroke-dasharray="3 3" />

      <rect x="320" y="0" width="60" height="40" rx="4" fill="#161616" stroke="#333" stroke-width="1" />
      <text x="328" y="25" fill="#8A8A8A" font-family="monospace" font-size="11">PAYMENT</text>
    </g>

    <!-- Key Metrics Badges -->
    <g transform="translate(0, 160)">
      <rect x="0" y="0" width="160" height="50" rx="4" fill="#121212" stroke="#262626" stroke-width="1" />
      <text x="15" y="24" fill="#F4C400" font-family="monospace" font-size="18" font-weight="bold">25K+ USERS</text>
      <text x="15" y="40" fill="#666" font-family="monospace" font-size="9">ACTIVE COMMUNITY</text>

      <rect x="180" y="0" width="160" height="50" rx="4" fill="#121212" stroke="#262626" stroke-width="1" />
      <text x="195" y="24" fill="#F4C400" font-family="monospace" font-size="18" font-weight="bold">4.8 / 5.0</text>
      <text x="195" y="40" fill="#666" font-family="monospace" font-size="9">STORE APP RATING</text>
    </g>
  </g>

  <!-- Corner Brackets -->
  <path d="M 20 20 L 40 20 M 20 20 L 20 40" stroke="#F4C400" stroke-width="2" />
  <path d="M 780 20 L 760 20 M 780 20 L 780 40" stroke="#F4C400" stroke-width="2" />
  <path d="M 20 480 L 40 480 M 20 480 L 20 460" stroke="#F4C400" stroke-width="2" />
  <path d="M 780 480 L 760 480 M 780 480 L 780 460" stroke="#F4C400" stroke-width="2" />
</svg>
