<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="bgCase1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414" />
      <stop offset="100%" stop-color="#0a0a0a" />
    </linearGradient>
    <pattern id="gridCase1" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1f1f1f" stroke-width="1" />
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#bgCase1)" />
  <rect width="800" height="500" fill="url(#gridCase1)" />
  
  <!-- Classified Banner -->
  <rect x="40" y="30" width="720" height="36" fill="#181818" stroke="#2d2d2d" stroke-width="1" />
  <rect x="40" y="30" width="6" height="36" fill="#F4C400" />
  <text x="60" y="53" fill="#F4C400" font-family="monospace" font-size="12" letter-spacing="2" font-weight="bold">
    CASE FILE #001 // SECTOR: AUTOMOTIVE LOYALTY
  </text>
  <text x="640" y="53" fill="#8A8A8A" font-family="monospace" font-size="11" letter-spacing="2">
    STATUS: ACTIVE
  </text>

  <!-- Mobile Device Wireframe / Architecture Schematics -->
  <!-- Left Phone Mockup Graphic -->
  <g transform="translate(140, 110)">
    <rect x="0" y="0" width="180" height="320" rx="24" fill="#101010" stroke="#F4C400" stroke-width="2" />
    <!-- Dynamic Island / Speaker -->
    <rect x="65" y="10" width="50" height="8" rx="4" fill="#222" />
    <!-- Screen Content Mock -->
    <rect x="15" y="35" width="150" height="50" rx="8" fill="#1b1b1b" stroke="#2c2c2c" stroke-width="1" />
    <rect x="25" y="48" width="60" height="8" rx="2" fill="#F4C400" />
    <rect x="25" y="62" width="100" height="6" rx="2" fill="#444" />
    
    <rect x="15" y="100" width="150" height="90" rx="8" fill="#171717" stroke="#252525" stroke-width="1" />
    <circle cx="40" cy="145" r="16" fill="#F4C400" opacity="0.2" />
    <path d="M 34 145 L 38 149 L 46 141" stroke="#F4C400" stroke-width="2" fill="none" />
    <rect x="65" y="135" width="80" height="8" rx="2" fill="#8A8A8A" />
    <rect x="65" y="150" width="50" height="6" rx="2" fill="#555" />

    <rect x="15" y="205" width="150" height="70" rx="8" fill="#171717" stroke="#252525" stroke-width="1" />
    <rect x="25" y="220" width="130" height="6" rx="2" fill="#F4C400" opacity="0.6" />
    <rect x="25" y="235" width="90" height="6" rx="2" fill="#444" />
    <rect x="25" y="250" width="110" height="6" rx="2" fill="#333" />
  </g>

  <!-- Right Architecture Flow & Telemetry -->
  <g transform="translate(380, 120)">
    <text x="0" y="30" fill="#F5F3EE" font-family="sans-serif" font-size="22" font-weight="bold" letter-spacing="1">
      LUMAX LOYALTY PLATFORM
    </text>
    <text x="0" y="60" fill="#8A8A8A" font-family="sans-serif" font-size="13">
      Automotive Rewards & Distributed Transaction Core
    </text>

    <!-- Architecture Nodes -->
    <g transform="translate(0, 90)">
      <rect x="0" y="0" width="110" height="40" rx="4" fill="#161616" stroke="#F4C400" stroke-width="1" />
      <text x="18" y="25" fill="#F4C400" font-family="monospace" font-size="11">FLUTTER UI</text>

      <line x1="110" y1="20" x2="160" y2="20" stroke="#F4C400" stroke-width="1.5" stroke-dasharray="3 3" />

      <rect x="160" y="0" width="110" height="40" rx="4" fill="#161616" stroke="#333" stroke-width="1" />
      <text x="178" y="25" fill="#8A8A8A" font-family="monospace" font-size="11">BLoC STATE</text>

      <line x1="270" y1="20" x2="320" y2="20" stroke="#F4C400" stroke-width="1.5" stroke-dasharray="3 3" />

      <rect x="320" y="0" width="60" height="40" rx="4" fill="#161616" stroke="#333" stroke-width="1" />
      <text x="330" y="25" fill="#8A8A8A" font-family="monospace" font-size="11">APIs</text>
    </g>

    <!-- Key Metrics Badges -->
    <g transform="translate(0, 160)">
      <rect x="0" y="0" width="160" height="50" rx="4" fill="#121212" stroke="#262626" stroke-width="1" />
      <text x="15" y="24" fill="#F4C400" font-family="monospace" font-size="18" font-weight="bold">50K+ USERS</text>
      <text x="15" y="40" fill="#666" font-family="monospace" font-size="9">PRODUCTION REACH</text>

      <rect x="180" y="0" width="160" height="50" rx="4" fill="#121212" stroke="#262626" stroke-width="1" />
      <text x="195" y="24" fill="#F4C400" font-family="monospace" font-size="18" font-weight="bold">99.9% UPTIME</text>
      <text x="195" y="40" fill="#666" font-family="monospace" font-size="9">TRANSACTION RELIABILITY</text>
    </g>
  </g>

  <!-- Corner Brackets -->
  <path d="M 20 20 L 40 20 M 20 20 L 20 40" stroke="#F4C400" stroke-width="2" />
  <path d="M 780 20 L 760 20 M 780 20 L 780 40" stroke="#F4C400" stroke-width="2" />
  <path d="M 20 480 L 40 480 M 20 480 L 20 460" stroke="#F4C400" stroke-width="2" />
  <path d="M 780 480 L 760 480 M 780 480 L 780 460" stroke="#F4C400" stroke-width="2" />
</svg>
