<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" fill="none">
  <defs>
    <radialGradient id="batGlow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#F4C400" stop-opacity="0.15" />
      <stop offset="70%" stop-color="#F4C400" stop-opacity="0.0" />
    </radialGradient>
    <linearGradient id="rimLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4C400" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#F4C400" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#F5F3EE" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="armorSheen" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#242424" />
      <stop offset="50%" stop-color="#141414" />
      <stop offset="100%" stop-color="#080808" />
    </linearGradient>
    <pattern id="halftoneHero" x="0" y="0" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#F4C400" opacity="0.12" />
    </pattern>
  </defs>

  <!-- Background Halftone & Ambient Atmosphere -->
  <rect x="50" y="50" width="700" height="900" fill="url(#halftoneHero)" />
  <circle cx="400" cy="350" r="300" fill="url(#batGlow)" />

  <!-- Signal Angle Backlight -->
  <polygon points="100,1000 380,180 500,180 750,1000" fill="#F4C400" opacity="0.04" />

  <!-- Cape Outlines & Wing Geometry (Left & Right Flanks) -->
  <g id="cape-silhouette">
    <!-- Outer dramatic cape sweep left -->
    <path d="M 330 260 C 240 290 120 420 80 620 C 50 780 40 920 60 980 C 130 920 180 870 230 920 C 270 850 320 820 370 870 L 370 320 Z" 
          fill="#0a0a0a" stroke="#1f1f1f" stroke-width="2" />
    <!-- Cape folds left -->
    <path d="M 340 310 Q 220 470 180 740 Q 210 650 250 630 Q 280 720 320 680 Z" 
          fill="#111111" opacity="0.8" />
    
    <!-- Outer dramatic cape sweep right -->
    <path d="M 470 260 C 560 290 680 420 720 620 C 750 780 760 920 740 980 C 670 920 620 870 570 920 C 530 850 480 820 430 870 L 430 320 Z" 
          fill="#0a0a0a" stroke="#1f1f1f" stroke-width="2" />
    <!-- Cape folds right -->
    <path d="M 460 310 Q 580 470 620 740 Q 590 650 550 630 Q 520 720 480 680 Z" 
          fill="#111111" opacity="0.8" />
  </g>

  <!-- Torso & Tactical Armor Plates -->
  <g id="body-armor">
    <!-- Main Chest Plate -->
    <polygon points="340,320 460,320 490,440 400,520 310,440" fill="url(#armorSheen)" stroke="#2a2a2a" stroke-width="2" />
    <!-- Center Sternum Ridge -->
    <line x1="400" y1="320" x2="400" y2="520" stroke="#F4C400" stroke-width="1.5" opacity="0.6" />

    <!-- Left Pectoral Armor -->
    <polygon points="335,330 395,330 395,430 320,410" fill="#181818" stroke="#2e2e2e" stroke-width="1.5" />
    <!-- Right Pectoral Armor -->
    <polygon points="465,330 405,330 405,430 480,410" fill="#151515" stroke="#2e2e2e" stroke-width="1.5" />

    <!-- Official Oval Batman Emblem on Chest Armor -->
    <g transform="translate(330, 365) scale(0.75)">
      <path fill="#100B08" d="M93.5821 108.3441c51.684,0 93.5821,-24.2537 93.5821,-54.1721 0,-29.9184 -41.8981,-54.172 -93.5821,-54.172 -51.6839,0 -93.5821,24.2537 -93.5821,54.172 0,29.9185 41.8982,54.1721 93.5821,54.1721z"/>
      <path fill="#F2BD00" stroke="#F2BD00" stroke-width="1" d="M93.582 103.0618c48.6606,0 88.1079,-21.8929 88.1079,-48.8992 0,-27.0061 -39.4472,-48.899 -88.1079,-48.899 -48.6606,0 -88.1079,21.8929 -88.1079,48.899 0,27.0063 39.4472,48.8992 88.1079,48.8992z"/>
      <path fill="#100B08" d="M60.4363 14.6262c-6.3146,8.2913 -8.158,16.1143 -1.4266,23.0389 4.1793,3.5474 9.131,4.9705 15.2981,3.0514 5.5304,-1.94 8.6055,-6.7561 9.7876,-13.7897 0.6707,-5.2067 0.7145,-10.492 0.8633,-15.764l4.8414 8.86c2.3485,-0.3551 4.8433,-0.3713 7.4868,-0.0434l4.816 -8.7933c0.1756,5.4578 0.252,10.9322 0.917,16.3084 1.3573,6.925 4.6304,11.7848 10.7704,13.554 3.2672,1.229 10.886,0.4106 14.4595,-3.5173 6.5247,-6.6171 4.4429,-15.2397 -1.6014,-22.7578 13.3257,3.1083 25.9841,8.4096 36.0795,15.9904 12.1742,9.8877 17.1528,22.6981 9.2709,36.3205 -4.2848,6.8447 -10.4736,13.7852 -27.1547,21.2529 2.2789,-3.8375 3.8909,-7.5638 4.3063,-11.0906 0.6816,-5.7963 -2.4147,-10.4988 -9.8008,-9.434 -5.2711,0.7599 -10.9501,4.8485 -15.3096,9.1079 -2.1931,-3.5258 -4.5779,-5.8229 -7.0813,-7.3609 -3.5222,-2.216 -7.1154,-1.6197 -10.7618,1.0715 -4.9385,3.9986 -9.4565,12.2292 -12.6507,21.813 -2.5528,-7.7751 -5.7769,-13.7601 -9.4479,-18.5535 -5.4506,-6.4349 -10.5428,-7.0653 -15.3722,-3.4373 -2.2072,1.7448 -4.0711,3.9596 -5.6881,6.512 -3.3819,-3.6867 -7.5085,-6.4251 -12.2571,-8.3726 -7.9066,-3.2699 -14.4339,1.8507 -12.7125,9.2182 0.7588,4.0135 2.0189,7.651 4.2686,10.5462 -13.3727,-5.7267 -23.0043,-13.339 -28.3018,-23.1654 -5.7593,-11.7659 -2.3824,-22.1613 6.7665,-31.691 8.9346,-8.1511 22.1279,-14.4505 39.6345,-18.8746z"/>
    </g>

    <!-- Abdominal Segment Plates -->
    <polygon points="350,450 450,450 440,490 360,490" fill="#131313" stroke="#222" stroke-width="1" />
    <polygon points="355,500 445,500 435,540 365,540" fill="#111111" stroke="#222" stroke-width="1" />
    <polygon points="360,550 440,550 425,600 375,600" fill="#0f0f0f" stroke="#222" stroke-width="1" />

    <!-- Utility Belt Section (Tactical Gold & Charcoal Capsules) -->
    <g id="utility-belt">
      <rect x="340" y="610" width="120" height="24" rx="3" fill="#141414" stroke="#F4C400" stroke-width="1.5" />
      <!-- Central Buckle -->
      <polygon points="390,606 410,606 414,638 386,638" fill="#F4C400" stroke="#080808" stroke-width="1.5" />
      <rect x="396" y="616" width="8" height="12" fill="#080808" />
      <!-- Left Pouches -->
      <rect x="345" y="613" width="12" height="18" rx="2" fill="#222" stroke="#444" stroke-width="1" />
      <rect x="362" y="613" width="12" height="18" rx="2" fill="#222" stroke="#444" stroke-width="1" />
      <rect x="379" y="613" width="6" height="18" rx="1" fill="#F4C400" opacity="0.7" />
      <!-- Right Pouches -->
      <rect x="415" y="613" width="6" height="18" rx="1" fill="#F4C400" opacity="0.7" />
      <rect x="426" y="613" width="12" height="18" rx="2" fill="#222" stroke="#444" stroke-width="1" />
      <rect x="443" y="613" width="12" height="18" rx="2" fill="#222" stroke="#444" stroke-width="1" />
    </g>
  </g>

  <!-- Shoulders & Pauldrons -->
  <polygon points="320,320 250,370 270,440 330,370" fill="#161616" stroke="#2e2e2e" stroke-width="1.5" />
  <polygon points="480,320 550,370 530,440 470,370" fill="#141414" stroke="#2e2e2e" stroke-width="1.5" />

  <!-- Neck & Cowl Base -->
  <polygon points="360,260 440,260 450,320 350,320" fill="#111111" stroke="#222" stroke-width="1.5" />
  <path d="M 370 280 L 400 310 L 430 280" stroke="#F4C400" stroke-width="1" opacity="0.4" fill="none" />

  <!-- Iconic Batman Cowl & Mask Silhouette -->
  <g id="cowl-head">
    <!-- Left Cowl Ear (Sharp, Angular, Tactical) -->
    <polygon points="345,110 375,190 355,220 335,160" fill="#080808" stroke="url(#rimLight)" stroke-width="2" />
    <!-- Right Cowl Ear (Sharp, Angular, Tactical) -->
    <polygon points="455,110 425,190 445,220 465,160" fill="#080808" stroke="#222" stroke-width="2" />

    <!-- Main Cowl Dome -->
    <polygon points="365,180 435,180 455,220 450,270 400,285 350,270 345,220" 
             fill="url(#armorSheen)" stroke="#222" stroke-width="1.5" />

    <!-- Cowl Brow & Cheekbone Chiaroscuro -->
    <!-- Left Brow -->
    <polygon points="360,210 395,225 390,235 355,220" fill="#1f1f1f" stroke="#333" stroke-width="1" />
    <!-- Right Brow -->
    <polygon points="440,210 405,225 410,235 445,220" fill="#141414" stroke="#222" stroke-width="1" />
    <!-- Nose Bridge -->
    <polygon points="395,225 405,225 403,255 397,255" fill="#2a2a2a" />

    <!-- Piercing Cowl Eye Lenses (Striking White/Yellow Glow) -->
    <polygon points="365,222 390,230 382,234 366,227" fill="#F5F3EE" filter="drop-shadow(0 0 6px #F4C400)" />
    <polygon points="435,222 410,230 418,234 434,227" fill="#F5F3EE" filter="drop-shadow(0 0 4px #F4C400)" />

    <!-- Exposed Jaw / Lower Face Opening (Dark Comic Ink Shading) -->
    <polygon points="380,265 420,265 415,290 400,296 385,290" fill="#1c1917" stroke="#2a2624" stroke-width="1" />
    <!-- Lips & Chin Shadow -->
    <path d="M 390 278 Q 400 280 410 278" stroke="#12100e" stroke-width="1.5" fill="none" />
    <polygon points="395,286 405,286 402,293 398,293" fill="#12100e" />
  </g>

  <!-- Editorial Rim Light Accents & Halftone Highlights -->
  <!-- Left Side Razor Rim Light (Batman Yellow) -->
  <path d="M 345 110 L 335 160 L 320 220 L 310 270 L 250 370 L 270 440" 
        stroke="#F4C400" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.85" />

  <!-- Floating Bat Swarm Accents -->
  <g fill="#F4C400" opacity="0.8">
    <path d="M 220 180 Q 225 174 232 180 Q 240 174 246 180 Q 236 186 232 182 Q 228 186 220 180 Z" />
    <path d="M 180 220 Q 183 216 188 220 Q 194 216 199 220 Q 191 224 188 221 Q 185 224 180 220 Z" />
    <path d="M 580 160 Q 585 154 592 160 Q 600 154 606 160 Q 596 166 592 162 Q 588 166 580 160 Z" />
    <path d="M 640 210 Q 644 206 649 210 Q 655 206 660 210 Q 652 214 649 211 Q 646 214 640 210 Z" />
  </g>

  <!-- Editorial HUD & Technical Framing Marks -->
  <g stroke="#F4C400" stroke-width="1" opacity="0.5">
    <!-- Corner brackets -->
    <path d="M 70 80 L 100 80 M 70 80 L 70 110" />
    <path d="M 730 80 L 700 80 M 730 80 L 730 110" />
    <path d="M 70 920 L 100 920 M 70 920 L 70 890" />
    <path d="M 730 920 L 700 920 M 730 920 L 730 890" />
    
    <!-- Target coordinate text -->
    <text x="110" y="85" fill="#F4C400" font-family="monospace" font-size="10" letter-spacing="2">SYS.TARGET // SECTOR 04</text>
    <text x="590" y="85" fill="#F4C400" font-family="monospace" font-size="10" letter-spacing="2">ID: DARK-KNIGHT</text>
  </g>
</svg>
